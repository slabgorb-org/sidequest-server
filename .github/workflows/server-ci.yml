name: server-ci

on:
  push:
    branches: [develop, "feat/**"]
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sidequest
          POSTGRES_PASSWORD: sidequest
          POSTGRES_DB: sidequest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sidequest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SIDEQUEST_TEST_DATABASE_URL: postgresql://sidequest:sidequest@localhost:5432/sidequest_test
      SIDEQUEST_DATABASE_URL: postgresql://sidequest:sidequest@localhost:5432/sidequest_test
    steps:
      - uses: actions/checkout@v4
      # Tests resolve the content repo as a sibling of the server checkout
      # (tests/conftest.py content_dir => <workspace>/../sidequest-content).
      # sidequest-content is private, so the default GITHUB_TOKEN cannot read
      # it — a fine-grained PAT with read-only Contents access is supplied via
      # the CONTENT_REPO_TOKEN secret. checkout cannot target a path outside
      # the workspace, so we clone into a subdir and relocate it to the sibling.
      - name: Checkout sidequest-content
        uses: actions/checkout@v4
        with:
          repository: slabgorb/sidequest-content
          ref: develop
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          path: _sidequest-content
      - name: Place sidequest-content beside the workspace
        run: mv "$GITHUB_WORKSPACE/_sidequest-content" "$(dirname "$GITHUB_WORKSPACE")/sidequest-content"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync --all-extras
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q
