name: cast_all_unratified_fixture
description: >-
  Edge-case test world for Story 75-13 (ADR-138 §D4). The world authors exactly
  ONE Cast member and it is unratified (observation_pending: true). After the
  ratification gate filters it out, NO Cast section is rendered — yet the
  reference.npc_unratified_skipped span must STILL fire with count == 1, proving
  the skip count is computed from the raw authored entries (the gate's input),
  not from the post-filter survivors. This is the all-withheld complement to the
  selective-withhold case in cast_ratification_fixture and the none-withheld
  baseline in cast_gated_fixture.
