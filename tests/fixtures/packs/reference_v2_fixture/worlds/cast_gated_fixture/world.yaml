name: cast_gated_fixture
description: >-
  Isolated test world for story 65-9 — manifest-gated Cast portraits. Two NPCs
  are authored in portrait_manifest.yaml (the public NPC projection), but only
  one (Vivian Harbormaster) has her world-scoped portrait key in
  tests/fixtures/r2_manifest.json. The other (Thessaly Dunmore) is
  authored-but-absent: she must render text-only (name/role/appearance, no
  <img>) once the R2-manifest existence gate lands. A naive renderer would emit
  a broken <img> for her — that is the bug 65-9 closes, the portrait analog of
  65-8's POI gate.
