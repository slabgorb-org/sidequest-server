world_name: Map Perm Fixture
starting_region: harbor_light
navigation_mode: region
map_style: Same graph as map_fixture, region keys authored in a different order.

# Region keys deliberately authored in REVERSE-ish order vs map_fixture
# (tide_market, the_deeps, drowned_coast, harbor_light) to prove node ordering
# is derived from the graph + starting_region, not YAML insertion order.
regions:

  tide_market:
    name: Tide Market
    summary: The salt-market at the tideline.
    description: A leaf region with no onward adjacency.
    adjacent: []

  the_deeps:
    name: The Deeps
    summary: The dark water past the shelf.
    description: Adjacent to tide_market and the dangling sunken_ghost.
    adjacent:
      - tide_market
      - sunken_ghost

  drowned_coast:
    name: Drowned Coast
    summary: A flooded shoreline of tide-ledgers and salt.
    description: Lists harbor_light back as adjacent — the reciprocal half.
    adjacent:
      - harbor_light

  harbor_light:
    name: Harbor Light
    summary: The lantern-town where travelers come ashore.
    description: The starting region; adjacent to drowned_coast and the_deeps.
    adjacent:
      - drowned_coast
      - the_deeps
