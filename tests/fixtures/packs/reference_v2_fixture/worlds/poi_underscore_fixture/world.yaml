name: poi_underscore_fixture
description: >-
  Isolated test world for story 71-38 — the underscore-slug POI gate bug. Mirrors
  a real world like oz: POIs are authored in history.yaml with UNDERSCORE slugs
  (munchkin_country), and their R2 landscape keys are written verbatim/underscore
  (.../poi/munchkin_country.png in tests/fixtures/r2_manifest.json). Pre-71-38 the
  lore gate slugifies the authored slug to a HYPHEN (munchkin-country), builds a
  hyphen R2 key, never matches the underscore manifest key, and emits 0 <img> —
  the load-bearing repro. Post-71-38 the gate must feed poi_image_key the VERBATIM
  underscore slug (so the img surfaces) while the card id / deep-link anchor keep
  the slugify (hyphen) form. emerald_void is authored-but-not-on-R2: it must stay
  omitted so the fix is a decouple, not a "render everything".
