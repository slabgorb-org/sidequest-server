# Authored order is load-bearing for 65-12 AC4: these four dialects are NOT
# uniformly parseable, so the timeline must preserve THIS order (authored_order
# mode), and The Nameless Age (no era, no period) must sort to the undated tail.
legends:
  - name: The Cataclysm
    era: "-11540"
    description: A comet struck the ocean and drowned the first empire.
  - name: The Mesh Launch
    era: 15 years ago
    description: The shared decision substrate went live and never went dark.
  - name: The Second Rising
    period: early Second Rising
    description: The scattered peoples rose again after the long dark.
  - name: The Bowery Wake
    era: "shot February 25, 1855, buried March 11"
    description: The butcher-champion died, by his own account, a true American.
  - name: The Nameless Age
    description: A time so old that no chronicle kept its date at all.
