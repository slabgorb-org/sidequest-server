name: timeline_sorted_fixture
description: >-
  Uniform-dialect world for story 65-12 AC4/AC6 (sorted mode). Every DATED
  legend carries a clean four-digit year, so the temporal values ARE uniformly
  parseable and the spine must sort dated entries ASCENDING by year
  (sort_mode == "sorted"). The legends are authored OUT of chronological order
  (1804, then undated, then 1612, then 1666) so a correct sort visibly reorders
  them — and the one undated legend (The Hollow Year), authored in the MIDDLE,
  must move to the tail. lore.yaml deliberately carries NO `history` field, so
  the Timeline section must render with NO preamble (AC5 negative).
