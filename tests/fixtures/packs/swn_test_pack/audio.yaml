mixer:
  music_volume: 0.35
  sfx_volume: 0.7
  crossfade_default_ms: 4000

ai_generation:
  enabled: true
  model: musicgen_small
  max_generation_time_s: 15
  cache_generated: true

themes:
  - name: exploration
    mood: exploration
    base_prompt: ""
    variations:
      - type: full
        path: audio/music/set-1/exploration_full.ogg
      - type: ambient
        # R2 object replaced 2026-06-07 with purchased audio (SciFi Atmosphere
        # Loops Vol1 — "3 Dark"); see genre_packs/PURCHASED_AUDIO.md. The old
        # ACE-Step track at this key was nuked by operator decision. No
        # *_input_params.json exists for this key — do not regenerate.
        path: audio/music/set-1/exploration_ambient.ogg
      - type: overture
        path: audio/music/set-1/exploration_overture.ogg
      - type: resolution
        path: audio/music/set-1/exploration_resolution.ogg
      - type: sparse
        path: audio/music/set-1/exploration_sparse.ogg
