# swn_test_pack — fixture bestiary (minimal, story 90-5 fail-loud gate).
#
# Pregen requires a bestiary for ruleset-module packs (encountergen seeds
# the Monster Manual encounters pool from it; "encountergen produced no
# output" raises EncounterSeedError since 90-5 item 3). This fixture pack
# predates that gate — tests that drive a full connect/pregen against it
# (e.g. test_dogfight_player_throw_roundtrip) need a non-empty pool source.
# Stat blocks mirror the SWN SRD foe shape used by the live packs
# (level == HD, ascending AC, morale on 2d12).
entries:
  - id: void_raider
    name: Void Raider
    level: 1
    hp: 5
    armor_class: 12
    attack_bonus: 1
    damage: "1d8"
    move: "10m"
    morale: 7
    skill: 1
    save: 15
    role: pirate boarding muscle
    tags: [human, pirate]
    description: >-
      A vacc-suited boarder with a mag-pistol and someone else's ship
      patch half-burned off the shoulder.
  - id: salvage_drone
    name: Rogue Salvage Drone
    level: 2
    hp: 9
    armor_class: 14
    attack_bonus: 2
    damage: "1d6"
    move: "15m"
    morale: 12
    skill: 1
    save: 14
    role: malfunctioning cutter drone
    tags: [robot, drone]
    abilities:
      - "Plasma cutter (ignores 2 points of armor soak)"
    description: >-
      A hull-stripping drone whose ownership tags were wiped; it cuts
      whatever its sensor cone says is salvage.
  - id: deck_boss
    name: Pirate Deck Boss
    level: 3
    hp: 14
    armor_class: 14
    attack_bonus: 3
    damage: "1d8+1"
    move: "10m"
    morale: 9
    skill: 2
    save: 13
    role: boarding-party leader
    tags: [human, pirate, leader]
    description: >-
      The one with the working comm bead and the shock baton, who decides
      which compartments get opened to vacuum.
