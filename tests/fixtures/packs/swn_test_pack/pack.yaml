name: SWN Test Pack
version: "1.0.0"
description: >-
  Synthetic SWN fixture pack for story 96-1. Genre-tier YAML frozen from
  live space_opera (rules/dogfight/classes/etc. at the epic 94 repoint) so
  combat, melee, ship_combat and dogfight tests drive the production code
  paths without coupling to live content. Content-only changes in
  sidequest-content must never turn server tests red — this pack is the
  fixture those tests run against. Not selectable in real play.
lobby_blurb: "Test fixture — frozen SWN rulebook for the server suite."
recommended_players:
  min: 1
  max: 5
  sweet_spot: 2
min_sidequest_version: "0.1.0"
refine_hooks: false

era_range: "Far future / unspecified"

core_vibe: >-
  A frozen test harness wearing a space opera costume.

emotional_tone:
  - determinism

extensions:
  - magic
  - projection
  - archetype_constraints
