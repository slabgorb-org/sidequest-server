- id: background
  title: How Did You End Up in the Reach?
  narration: |
    There's one way into Coyote Star and one way out, and they are the
    same jump point. Whatever cosmology you carry — Hegemony Core, dust-bowl
    colony, a station you've never named to outsiders — it's behind you now,
    or it never existed. The Reach is what you've got.

    Where did the Reach get you?
  loading_text: "The dust settles around the answer..."
  choices:
    - label: I Came Through the Gate
      description: >-
        Grand Gate is just a customs ring and a checkpoint, but you remember
        the inspector's face when she stamped your manifest like every word
        on it was a lie. You came through with a duffel and a story and not
        enough fuel to leave again. That was a year ago. Or five. The Reach
        does that to time.
      mechanical_effects:
        race_hint: Coreworlder
        background: Outsystem-arrived
        jungian_hint: outlaw
    - label: Far Landing Raised Me
      description: >-
        You were born on the dust. You know which streets in Vaskov Centrum
        wash out in the rains, which Compact foreman pays in scrip and
        which pays in ore, which dust storm warnings to ignore. The Reach is
        the only place you've ever been and you'd still rather be here than
        somewhere with too much sky.
      mechanical_effects:
        race_hint: Colonial
        background: Far Landing-raised
        jungian_hint: everyman
    - label: Turning Hub Was the Whole World
      description: >-
        You grew up in voidborn corridors — a Moana-Teru kid who could read
        a docking schedule before you could read a book. Forty years of
        clan history runs through Turning Hub and you carry some of it.
        Gravity is something you visit. The black isn't hostile to you;
        it's the ceiling you grew up under.
      mechanical_effects:
        race_hint: Spacer
        background: Hub-born
        jungian_hint: explorer
    - label: I Lived Near the Deep Root
      description: >-
        Some humans live close to the Tsveri. Not on their land — nobody
        does that — but in the foothills, where the subsonic registers
        carry on the wind and you learn early that the ground here is older
        than your settlement, your colony, your species. You came back into
        Far Landing with patience and quiet and a way of hearing things
        nobody talks about.
      mechanical_effects:
        race_hint: Reach-touched
        background: Deep Root-adjacent
        jungian_hint: magician
  allows_freeform: true

- id: pronouns
  title: How Do the Manifests Read?
  narration: >-
    Everything in the Reach gets logged somewhere — Vaskov customs, Compact
    rolls, Turning Hub dock records, the unofficial ledger Drift Runners
    keep in case they need to call in a favor. Your name is on at least one
    of those. How does it read?
  allows_freeform: true
  choices:
    - label: "she/her"
      description: "She walks her own path."
      mechanical_effects:
        pronoun_hint: "she/her"
    - label: "he/him"
      description: "He forges his own way."
      mechanical_effects:
        pronoun_hint: "he/him"
    - label: "they/them"
      description: "They answer to no one's expectations."
      mechanical_effects:
        pronoun_hint: "they/them"

- id: crucible
  title: What Did You Do for the Reach?
  narration: |
    The Reach has work, and the work has shapes — Vaskov uniforms, Compact
    rigs, prospector skiffs, the cargo nobody admits to moving, the
    conversations that happen in the back rooms of Turning Hub. Whatever
    you did, it left marks on you. People can read them.

    What did you do?
  choices:
    - label: I Wore the Uniform
      description: >-
        Vaskov Patrol. Maybe you were good at it. Maybe you were the one
        officer who actually tried. Maybe you held a checkpoint nobody else
        wanted because Prefect Vaskov knew you'd hold it. The uniform meant
        something to you, even when it meant nothing to anyone else out
        here.
      mechanical_effects:
        class_hint: Officer
        personality_trait: decisive
        jungian_hint: ruler
        rpg_role_hint: support
    - label: I Worked the Rig
      description: >-
        Compact Hand — drillers, riggers, the people who fix the harness
        when the methane breach happens. You know the smell of bad
        atmosphere and the sound a hull makes thirty seconds before it
        gives up. You can keep something running on parts it shouldn't be
        running on. That has value out here.
      mechanical_effects:
        class_hint: Engineer
        personality_trait: methodical
        jungian_hint: magician
        rpg_role_hint: support
    - label: I Flew the Belt
      description: >-
        Survey Runner. Prospector skiffs through the Broken Drift, claims
        filed on whatever scanned for ore and a few things that didn't.
        You charted routes that aren't on any Hegemonic map. The outer
        system is full of places nobody has named yet. You've been to some
        of them.
      mechanical_effects:
        class_hint: Pilot
        personality_trait: restless
        jungian_hint: explorer
        rpg_role_hint: jack_of_all_trades
    - label: I Ran the Drift
      description: >-
        The cargo that customs doesn't see. The dead-claim drops, the
        hidden compartments, the manifest that says ten crates and ships
        twelve. You moved things through the belt that nobody admits
        existed. Drift Runners look out for each other — mostly — and you
        learned which captains to trust by surviving the ones who weren't.
      mechanical_effects:
        class_hint: Smuggler
        personality_trait: adaptable
        jungian_hint: outlaw
        rpg_role_hint: stealth
    - label: I Traded in Words
      description: >-
        Far Landing Fixer. Hub Intelligence Broker. The person every
        faction calls when they need something said carefully. You don't
        carry a side; you carry leverage. You know what Dura Mendes won't
        say in public and what Rangi Moana-Teru won't put in writing, and
        you trade those silences for the things you actually need.
      mechanical_effects:
        class_hint: Diplomat
        personality_trait: perceptive
        jungian_hint: sage
        rpg_role_hint: control
  allows_freeform: true

- id: drive
  title: What Cut You Loose?
  narration: |
    Everyone in the Reach has had a year — last year, this year, the year
    that's still happening. Something pulled you out of whatever shape your
    life used to hold. You're not where you were. You may not have admitted
    why, even to yourself, but it's the engine you're running on now.

    What cut you loose?
  choices:
    - label: Someone Went Into the Drift
      description: >-
        Family. Crew. A name you don't say out loud anymore. They went out
        on a survey run, a salvage job, a haul nobody else would take —
        and the transponder went quiet between Grand Gate and the belt.
        The Compact filed it. The Patrol filed it. You haven't.
      mechanical_effects:
        relationship: lost_beloved
        goals: find_what_was_lost
        emotional_state: quietly grieving
        jungian_hint: lover
    - label: A Debt That Followed Me Through the Gate
      description: >-
        Not money. A promise broken back where you came from, an oath you
        couldn't keep, a body you owe somebody for. You thought the Reach
        was far enough. It might be. Or it might not — you've started
        watching the inbound jump traffic in a way that means you haven't
        decided yet.
      mechanical_effects:
        relationship: creditor
        goals: settle_a_debt
        emotional_state: burdened
        jungian_hint: everyman
    - label: My Place Got Dissolved
      description: >-
        A Compact claim that lost arbitration. A patrol unit Vaskov quietly
        retired. A Hub corridor that got rezoned. A settlement that ran out
        of water. Whatever held you is gone, and the people in it
        scattered — some you can find, some you can't, some you're not
        sure you want to.
      mechanical_effects:
        relationship: displaced_community
        goals: find_belonging
        emotional_state: determined
        jungian_hint: hero
    - label: I Saw Something Out Past the Gas Giant
      description: >-
        An energy reading that shouldn't have been there. A signal pattern
        that doesn't match any catalog. A shape against the dark that
        didn't move like a ship and didn't move like a rock. You filed
        nothing. You went back twice. You can't stop wanting to go back
        again.
      mechanical_effects:
        relationship: wanderlust
        goals: explore_the_unknown
        emotional_state: wide-eyed
        jungian_hint: explorer
  allows_freeform: true

- id: role
  title: When the Reach Goes Sideways, What Do You Bring?
  narration: |
    Out here, sideways is the resting state. The Patrol's stretched, the
    Compact's overworked, the Hub's neutral on principle, and the Drift
    Runners answer to no one. When something breaks, the people around you
    look to whoever's got something to give. What do they see, looking at
    you?
  choices:
    - label: Steady Hands
      description: >-
        When everything goes wrong, you get calm. Not brave — calm. The
        panic doesn't reach your hands. People who've worked with you in
        bad atmosphere or under fire have noticed. They mention it later,
        usually when they're trying to recruit you.
      mechanical_effects:
        personality_trait: steady
        jungian_hint: caregiver
    - label: A Sharp Mouth
      description: >-
        You talk fast, think faster, and people listen before they realize
        they've been convinced. It's not charm. It's velocity. A Vaskov
        inspector once let you walk because you had your story straight
        before he had his question straight.
      mechanical_effects:
        personality_trait: quick-witted
        jungian_hint: jester
    - label: Loyalty
      description: >-
        Once you're in, you're in. You don't leave people behind on a
        breached rig, you don't sell crewmates to customs, and that is not
        negotiable. It's cost you before — a job, a faction, a friend who
        wasn't really. You'd pay it again.
      mechanical_effects:
        personality_trait: loyal
        jungian_hint: caregiver
    - label: The Wrong Kind of Luck
      description: >-
        Things happen around you. The cargo nobody else gets caught with.
        The witness nobody else is at. The signal that pings off your
        scanner three days before anyone else's. The Reach has a name for
        people like you, and it's not a compliment, but everyone wants you
        on their crew anyway.
      mechanical_effects:
        personality_trait: trouble-magnet
        # jungian_hint: outlaw — playtest 2026-05-02. Was `innocent`, but
        # `[innocent, stealth]` is the genre's only forbidden pairing
        # (`archetype_constraints.yaml`), and the Smuggler crucible routes
        # rpg_role_hint=stealth — leaving any Smuggler+Trouble-Magnet build
        # dead-ending at the chargen gate. Outlaw fits the description
        # ("the Reach has a name for people like you") and pairs cleanly
        # with every crucible's rpg_role_hint:
        #   stealth (Smuggler)        → Drift Runner    (common)
        #   support (Officer/Engineer)→ Manifest Ghost  (uncommon)
        #   jack_of_all_trades (Pilot)→ Drift Runner    (common)
        #   control (Diplomat)        → Manifest Ghost  (uncommon)
        jungian_hint: outlaw
  allows_freeform: true

- id: confirmation
  title: Aboard the Kestrel
  narration: |
    {name}.

    The {class} from {race} space — for whatever those words mean here, where
    every label is a story somebody tells about you.

    The Kestrel hums her quiet-coast hum, the long low note voidborn crews
    call the breath of a ship that knows where she's going. The Reach is
    wide. The crew is the crew. Whatever shift this is on her — galley,
    cockpit, the long deck-three spine — the morning, such as it is on a
    ship that has no morning, is yours.

    Begin.
  choices: []
  allows_freeform: false
