# Heavy Metal — audio configuration
#
# Baroque doom, ritual thaumaturgy, collapsing courts. The music is
# funereal, processional, and very slow — heavy strings, tolling bells,
# low brass, choir. Think Górecki's Third Symphony crossed with Ligeti's
# Requiem, not actual heavy metal music.
#
# Track paths target sq-music output conventions. Generate with:
#   /sq-music --genre heavy_metal --mood <mood>

mood_tracks:
  exploration:
    - path: audio/music/exploration_full.ogg
      title: "Processional"
      bpm: 60
      energy: 0.3
    - path: audio/music/exploration_ambient.ogg
      title: "The Long Road to the Court"
      bpm: 55
      energy: 0.25
  combat:
    - path: audio/music/combat_full.ogg
      title: "Sword and Oath"
      bpm: 120
      energy: 0.85
    - path: audio/music/combat_overture.ogg
      title: "The Line Holds"
      bpm: 110
      energy: 0.8
    - path: audio/music/battle_hymn_of_war.ogg
      title: "Battle Hymn of War"
      bpm: 112
      energy: 0.8
  tension:
    - path: audio/music/tension_full.ogg
      title: "The Collector Approaches"
      bpm: 50
      energy: 0.45
    - path: audio/music/tension_tension_build.ogg
      title: "Something Watches from the Colonnade"
      bpm: 45
      energy: 0.4
    - path: audio/music/the_desolate_expanse.ogg
      title: "The Desolate Expanse"
      bpm: 50
      energy: 0.4
  ritual:
    - path: audio/music/ritual_full.ogg
      title: "Working the Rite"
      bpm: 40
      energy: 0.55
    - path: audio/music/ritual_ambient.ogg
      title: "The Terms Are Laid Down"
      bpm: 35
      energy: 0.5
    - path: audio/music/the_monolith.ogg
      title: "The Monolith"
      bpm: 42
      energy: 0.55
    - path: audio/music/angelic_voices.ogg
      title: "Angelic Voices"
      bpm: 44
      energy: 0.5
  sorrow:
    - path: audio/music/sorrow_full.ogg
      title: "Ashes of the Last Prince"
      bpm: 50
      energy: 0.3
    - path: audio/music/dwarven_farewell.ogg
      title: "A Dwarven Farewell"
      bpm: 48
      energy: 0.3
  rest:
    - path: audio/music/rest_full.ogg
      title: "A Candle, a Name, a Silence"
      bpm: 55
      energy: 0.2

sfx_library:
  # Placeholder SFX — replace with curated assets.
  sword_clash:
    - audio/sfx/sword_clash.ogg
  armor_clank:
    - audio/sfx/armor_clank.ogg
  door_creak:
    - audio/sfx/door_creak.ogg
  footsteps_stone:
    - audio/sfx/footsteps.ogg
  bell_toll:
    - audio/sfx/bell_toll.ogg
  wind_dirge:
    - audio/sfx/wind_dirge.ogg
  rite_chime:
    - audio/sfx/rite_chime.ogg
  parchment_rustle:
    - audio/sfx/parchment_rustle.ogg

mixer:
  music_volume: 0.08
  sfx_volume: 0.12
  voice_volume: 1.0
  crossfade_default_ms: 4000

ai_generation:
  enabled: true
  model: musicgen_small
  max_generation_time_s: 20
  cache_generated: true

# Mood aliases — map genre-specific terms to core interpreter moods.
# The engine's core mood vocabulary includes exploration/combat/tension/
# rest/sorrow; "ritual" is a heavy_metal-specific mood that falls back
# to tension when a ritual-specific track is unavailable.
mood_aliases:
  procession: sorrow
  court: tension
