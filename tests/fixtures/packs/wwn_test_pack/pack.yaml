name: WWN Test Pack
version: "1.0.0"
description: >-
  Synthetic WWN fixture pack for story 96-1. Genre-tier YAML frozen from
  live heavy_metal, with a test_world that authors WORLD-TIER caster
  Callings (Psychic, Gadgeteer) so chargen tests prove the resolve_classes
  world-REPLACE seam without coupling to live content. Content-only
  changes in sidequest-content must never turn server tests red — this
  pack is the fixture those tests run against. Not selectable in real play.
lobby_blurb: "Test fixture — frozen WWN rulebook for the server suite."
recommended_players:
  min: 1
  max: 5
  sweet_spot: 2
min_sidequest_version: "0.1.0"
refine_hooks: false

era_range: "Mythic past / unspecified"

core_vibe: >-
  A frozen test harness wearing battle denim.

emotional_tone:
  - determinism

extensions:
  - projection
  - archetype_constraints
