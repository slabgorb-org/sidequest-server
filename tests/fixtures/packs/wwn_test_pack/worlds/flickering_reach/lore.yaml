world_name: Flickering Reach

geography: >-
  A stretch of cracked hardpan under a stuttering sun — the dead
  crossroads where three ruined roads meet, ringed by the rusted
  hulks of a caravan that never arrived. Just enough of a place for a
  chargen-wiring test to bind a world that genuinely seeds a Monster
  Manual. It has no ambitions beyond resolving a tier-1 encounter so
  the suite never leans on a swallowed fail-loud guard again.
