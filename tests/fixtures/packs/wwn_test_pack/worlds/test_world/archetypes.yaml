# Barsoom — World Archetypes
#
# Per the layered content model, named archetypes belong at the world tier:
# their flavor references named Barsoom peoples, cities, and texture (Helium,
# Zodanga, the green hordes, fliers, the long-sword, the canal-belt). The
# genre-tier heavy_metal/archetypes.yaml is intentionally empty.
#
# Story 1 ships the martial/expert core of the red and green peoples. These
# reference only the non-caster WWN Callings (Warrior, Expert) — Barsoom's two
# caster traditions (Lotharian Mentalist, Barsoomian Super-scientist) and their
# archetypes arrive with the magic content (Stories 4-5), NOT the genre's
# doom-flavored Necromancer/Elementalist/Pact-born traditions, which do not
# exist on Mars.

- name: Heliumetic Officer
  description: >-
    A commissioned officer of Helium's flier-navy or city guard, raised
    to the code: a guest is sacred, a given word is a debt, and a quarrel
    is answered with the long-sword. They wear the harness of the twin
    city with visible pride and would sooner die than be shown to have
    lied. They read the old science enough to con a flier, but they trust
    a blade.
  personality_traits:
    - honorable to a fault
    - jealous of the city's name
    - quick to a challenge
  typical_classes:
    - Warrior
  typical_races:
    - Red Martian
  stat_ranges:
    strength: [12, 16]
    dexterity: [11, 15]
    charisma: [11, 15]
  inventory_hints:
    - a long-sword and short-sword paired at the harness
    - a radium pistol, inert until sunlight
    - the metal cockade of Helium worked into the leather
  dialogue_quirks:
    - measures a stranger by whether they keep their word
    - speaks of the city as "she"
  disposition_default: 1
  ocean:
    openness: 5.0
    conscientiousness: 7.5
    extraversion: 5.5
    agreeableness: 5.5
    neuroticism: 4.0

- name: Panthan (Free-sword)
  description: >-
    A wandering swordsman who sells their blade from city to city, owing
    no jeddak and keeping their own honor instead. A panthan is judged on
    two things only — the quality of their sword-arm and whether they keep
    a bargain once struck — and a good one is welcome anywhere a war is
    brewing, which on Barsoom is everywhere.
  personality_traits:
    - self-possessed
    - loyal to the contract, not the crown
    - restless
  typical_classes:
    - Warrior
    - Expert
  typical_races:
    - Red Martian
  stat_ranges:
    strength: [12, 17]
    dexterity: [12, 16]
    constitution: [11, 15]
  inventory_hints:
    - a much-used long-sword with a re-wrapped grip
    - a thin roll of harness-leather and tools to mend it
    - a tally of cities served, scratched inside a vambrace
  dialogue_quirks:
    - names a price before naming a loyalty
    - understates their own reputation
  disposition_default: 0
  ocean:
    openness: 6.0
    conscientiousness: 6.0
    extraversion: 5.0
    agreeableness: 5.0
    neuroticism: 4.5

- name: Zodangan Agent
  description: >-
    A quiet servant of Zodanga who is never, officially, an assassin —
    that guild does not exist. They carry correct papers, smile at the
    right moments, and learn a rival city's flier-dispositions the way
    other people learn gossip. They settle a problem at one remove, by
    the guild, never by their own hand, and enjoy a stranger's scrutiny
    more than is wise.
  personality_traits:
    - smiling and patient
    - never the one holding the knife
    - allergic to leaving a witness
  typical_classes:
    - Expert
  typical_races:
    - Red Martian
  stat_ranges:
    dexterity: [12, 16]
    intelligence: [12, 16]
    charisma: [12, 16]
  inventory_hints:
    - papers that are correct in every visible particular
    - a stoppered vial that is not what the label says
    - a memorized list of names, never written down
  dialogue_quirks:
    - agrees warmly and commits to nothing
    - asks after your family by name you never gave
  disposition_default: -2
  ocean:
    openness: 5.5
    conscientiousness: 7.0
    extraversion: 6.0
    agreeableness: 3.5
    neuroticism: 5.0

- name: Canal-City Savant
  description: >-
    An artisan-scholar of one of the red cities who keeps the old science
    running — the radium cutters, the flier-rays, the pumps that lift the
    polar water through the ruled canals. They are not sorcerers; they are
    engineers of a dying inheritance, half of which they cannot rebuild
    and all of which they are terrified of losing. A few of them dream of
    the deeper arts the ancients are said to have kept.
  personality_traits:
    - meticulous
    - haunted by what cannot be remade
    - protective of the old machines
  typical_classes:
    - Expert
  typical_races:
    - Red Martian
  stat_ranges:
    intelligence: [13, 17]
    wisdom: [11, 15]
    dexterity: [10, 14]
  inventory_hints:
    - a roll of fine tools for radium-work
    - a cracked lens and a notebook of repairs that worked once
    - a charm against the day the Atmosphere Plant fails
  dialogue_quirks:
    - explains one thing too many when nervous
    - measures danger in whether a machine can be replaced
  disposition_default: 0
  ocean:
    openness: 7.5
    conscientiousness: 7.5
    extraversion: 3.5
    agreeableness: 5.5
    neuroticism: 6.0

- name: Green Horde Warrior
  description: >-
    A fifteen-foot, four-armed giant of the dead sea bottoms — Thark or
    Warhoon — raised communally with no knowledge of a mother and trained
    from the egg to cruelty and discipline. They own nothing but their
    harness and weapons, hold all else in common with the horde, and take
    rank by killing the one who holds it. They ride an eight-legged mount
    across the cracked ochre bottom and have never been taught to laugh.
  personality_traits:
    - savage and disciplined
    - contemptuous of softness
    - bound absolutely to horde custom
  typical_classes:
    - Warrior
  typical_races:
    - Green Martian
  stat_ranges:
    strength: [15, 18]
    constitution: [14, 18]
    dexterity: [10, 14]
  inventory_hints:
    - a long-sword and a radium rifle sized for a giant
    - harness-metal taken from defeated chieftains
    - the picket-line of an eight-legged war-mount
  dialogue_quirks:
    - states intentions flatly, without threat or boast
    - finds a stranger's laughter incomprehensible
  disposition_default: -1
  ocean:
    openness: 3.0
    conscientiousness: 7.0
    extraversion: 4.5
    agreeableness: 2.5
    neuroticism: 4.0

- name: Green Outcast
  description: >-
    A green Martian who, across a long savage life, learned the one thing
    their people bred out of themselves: that a captive can be a friend,
    that loyalty can outrank the horde. It makes them dangerous to their
    own kind and never quite trusted by the red cities either — a giant
    walking between two worlds, carrying a tenderness they cannot afford
    to show.
  personality_traits:
    - quietly heretical to horde custom
    - fiercely loyal once given
    - watchful of both peoples
  typical_classes:
    - Warrior
    - Expert
  typical_races:
    - Green Martian
  stat_ranges:
    strength: [14, 18]
    constitution: [13, 17]
    wisdom: [11, 15]
  inventory_hints:
    - a long-sword kept for a debt of honor, not a horde
    - a small kept token from a friend the horde would not understand
    - harness re-marked to no allegiance
  dialogue_quirks:
    - says little, and means all of it
    - guards the word "friend" like a weapon
  disposition_default: 1
  ocean:
    openness: 5.5
    conscientiousness: 7.0
    extraversion: 3.5
    agreeableness: 6.0
    neuroticism: 4.5

# --- The South (Story 89-2): non-caster martial/expert archetypes for the
# Thern and First Born peoples. As with the red/green core these reference only
# the non-caster WWN Callings (Warrior, Expert); no mechanics are authored here,
# only flavor, OCEAN, and chargen-funnel hints.

- name: Holy Thern
  description: >-
    A white-skinned priest of the southern death-cult, hairless beneath a
    flowing golden wig, raised inside the ten-thousand-year fraud of the
    Valley Dor and certain — or trained to be certain — of his own divine
    exemption from death. He keeps the secret with a blade as readily as
    with a sermon, harvests the pilgrims he was taught are offerings, and
    has built a whole serene cruelty on a faith he has never once been
    permitted to question.
  personality_traits:
    - serene and condescending
    - merciless in defence of the secret
    - inwardly brittle where the lie is thin
  typical_classes:
    - Expert
    - Warrior
  typical_races:
    - Thern
  stat_ranges:
    intelligence: [12, 16]
    charisma: [12, 16]
    wisdom: [11, 15]
  inventory_hints:
    - a golden wig and the jeweled circlet of the priesthood
    - a long-sword the sermons pretend he never needs
    - a key to a cliff-temple vault, worn against the skin
  dialogue_quirks:
    - speaks of slaughter in the gentle vocabulary of grace
    - cannot quite hide a flinch when the faith is named a fraud
  disposition_default: -1
  ocean:
    openness: 4.0
    conscientiousness: 7.0
    extraversion: 5.0
    agreeableness: 3.5
    neuroticism: 5.5

- name: Thern Apostate
  description: >-
    A Thern who, somewhere in a long false-eternal life of keeping the
    secret, stopped believing it — and now carries the most dangerous
    knowledge on Barsoom inside the skin of the people who guard it. Still
    wigged, still trusted by the temple, and quietly done with the harvest,
    the apostate walks the Golden Cliffs as a traitor no one has caught,
    weighing what the truth is worth against what telling it will cost.
  personality_traits:
    - outwardly devout, inwardly seceded
    - haunted by the harvests already kept
    - cautious to the point of pain
  typical_classes:
    - Expert
    - Warrior
  typical_races:
    - Thern
  stat_ranges:
    intelligence: [13, 17]
    dexterity: [11, 15]
    wisdom: [12, 16]
  inventory_hints:
    - the wig and circlet still worn as a disguise, not a faith
    - a smuggled token of a pilgrim he failed to save
    - a memorized secret way down toward the buried sea
  dialogue_quirks:
    - speaks the temple's pieties with a half-beat too much care
    - guards the truth of Dor like a blade he is afraid to draw
  disposition_default: 1
  ocean:
    openness: 7.0
    conscientiousness: 6.5
    extraversion: 3.5
    agreeableness: 5.5
    neuroticism: 6.5

- name: First Born Corsair
  description: >-
    A glossy-black-skinned warrior of Omean, raised to believe his is the
    oldest and highest race of Barsoom and answerable to none but Issus. He
    rides the black fliers up the concealed shaft to raid the surface by
    night, fights with a cold artistry, takes slaves rather than friends,
    and has never personally been beaten in the open — a certainty that has
    made him magnificent, contemptuous, and entirely untested.
  personality_traits:
    - proud and contemptuous of all other races
    - coldly skilled and unhurried in a fight
    - devout toward Issus in public, calculating in private
  typical_classes:
    - Warrior
    - Expert
  typical_races:
    - First Born
  stat_ranges:
    strength: [12, 16]
    dexterity: [13, 17]
    charisma: [11, 15]
  inventory_hints:
    - a long-sword and short-sword of fine black-and-gold make
    - the harness-jewels of a dator of the corsairs
    - a navigator's mark for the buried shaft out of Omean
  dialogue_quirks:
    - addresses other races as lesser things, by reflex
    - measures an enemy by whether they fight beautifully
  disposition_default: -2
  ocean:
    openness: 4.5
    conscientiousness: 6.5
    extraversion: 5.5
    agreeableness: 3.0
    neuroticism: 3.5

# ---------------------------------------------------------------------------
# The North & Lothar (Story 89-3). Non-caster martial/expert archetypes for the
# yellow men of Okar and the people of Lothar. The Lotharian MENTALIST caster
# tradition (phantom bowmen as a spells_wwn list, Mage-Calling funnel) is
# deliberately NOT authored here — it arrives with the magic content (89-4/89-5)
# per the file header. The Lotharian archetype below is the city's flavor as a
# people, on the inherited Warrior/Expert chassis only.
# ---------------------------------------------------------------------------
- name: Okarian Guardsman
  description: >-
    A black-bearded warrior of the crystal domes, raised in the warm green
    hothouse cities behind the polar ice and trained to the suspicion of his
    people: that everything beyond the Carrion Caves is an enemy and a
    prisoner-in-waiting. He keeps the gates of Okar, fights the white apes and
    the cold as readily as any invader, and serves a jeddak of jeddaks whose
    arenas he stocks without quite letting himself ask what kind of man does
    that — unless, one cold day, he does.
  personality_traits:
    - suspicious of all outsiders by training
    - hardy against cold and the predators of the ice
    - loyal to the domes, uneasy about the throne
  typical_classes:
    - Warrior
    - Expert
  typical_races:
    - Yellow Martian
  stat_ranges:
    strength: [12, 16]
    constitution: [12, 16]
    wisdom: [10, 14]
  inventory_hints:
    - heavy fur-and-leather harness made for the polar cold
    - a long-sword and a hooked ice-axe for the caverns
    - a dome-warden's token marking his right to the gates
  dialogue_quirks:
    - calls everyone from the warm world below a "lowlander"
    - speaks of the jeddak of jeddaks with careful, listening loyalty
  disposition_default: -1
  ocean:
    openness: 3.5
    conscientiousness: 7.0
    extraversion: 4.5
    agreeableness: 4.0
    neuroticism: 4.5

- name: Lotharian Survivor
  description: >-
    One of the last of an ancient white race, dwelling in the ruin of Lothar
    above the dead sea of Throxeus, kept alive by the city's conjured defenses
    and by a pride older than the red empires. Not every Lotharian is a master
    of the phantom bowmen, but every one of them has lived a long age inside
    that uncanny defense and learned to doubt his own eyes; courteous,
    brilliant, half-mad with isolation, he weighs a stranger first by whether
    that stranger can tell a true thing from a thing merely willed to seem so.
  personality_traits:
    - courteous and treacherous by turns
    - ancient, isolated, and quietly unstable
    - measures everyone against the seam between real and willed
  typical_classes:
    - Expert
    - Warrior
  typical_races:
    - Lotharian
  stat_ranges:
    intelligence: [13, 17]
    wisdom: [12, 16]
    charisma: [11, 15]
  inventory_hints:
    - the worn finery of a vanished seafaring age
    - a real bow kept beside a phantom one, to prove a point
    - a token of the city's feud over what the bowmen truly are
  dialogue_quirks:
    - asks, as a courtesy, whether you are quite sure what you saw
    - speaks of long-dead companions as though they stepped out an hour ago
  disposition_default: 0
  ocean:
    openness: 7.5
    conscientiousness: 5.5
    extraversion: 4.0
    agreeableness: 4.5
    neuroticism: 6.5
