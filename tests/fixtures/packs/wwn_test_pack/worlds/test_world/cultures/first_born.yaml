name: First Born
summary: Black-skinned pirates of the buried sea of Omean — self-styled living
  gods and raiders of the Thern temples, worshippers of Issus
description: >-
  The First Born, the black men of Barsoom, hold themselves the oldest
  and highest race of the dying world — sprung, they say, from the
  first tree of life, and answerable to none but the goddess Issus.
  Glossy-black-skinned, beautiful, and merciless, they live in the
  caverns of Omean, the buried sea beneath the southern pole, and rise
  in their black fliers through a single concealed shaft to raid the
  surface by night. They prey upon the Therns who prey upon the
  pilgrims — a three-tiered predation that ends at the throne of Issus,
  whom they serve as living men serve a god and feed as a god is fed.
  They take slaves, not friends; they fight with a cold artistry; and
  they have never in their long history been beaten in the open, which
  has made them certain of a supremacy that has never truly been
  tested. Their dators — the noble captains of the black corsairs —
  command Omean's fleets, and answer, in the end, to Issus alone.
