name: Thern
summary: White-skinned false priests of the southern death-cult — wig-wearing
  pretenders to holiness who prey on the pilgrims voyaging down the River Iss
description: >-
  The Therns are a white-skinned race of the far south, smooth-bodied
  and hairless, who hide their baldness beneath flowing yellow wigs and
  pass themselves off as a holy people set above all the rest of
  Barsoom. They hold the Golden Cliffs and the Valley Dor at the mouth
  of the River Iss, and they have built upon the whole world's oldest
  faith the cruelest of frauds: that the aged and the despairing who
  voyage down the Iss come to a paradise, when in truth they come to be
  hunted, enslaved, and devoured. The Therns believe — or profess to
  believe — that they alone are exempt from death's road and will be
  taken up by the goddess. They are learned, cold, and certain of their
  own divinity, and they keep their secret by killing any who would
  carry it back up the river. A few, in a long false-eternal life,
  begin to doubt the lie they were raised inside.
