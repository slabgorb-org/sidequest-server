# World-tier equipment_tables override (fixture for story 120-4).
# The loader must load this into World.equipment_tables, and
# resolve_equipment_tables(pack, "test_world") must MERGE it over the genre tier:
#   * per-slot APPEND within each class kit (genre items first, then these)
#   * guaranteed_grants APPEND by kit_id
# So for warrior_kit the resolved utility becomes [genre_rope, world_lockpick],
# a brand-new `light` slot appears [world_torch], weapon stays [genre_blade]
# (genre-only), and grants become [genre_tonic, world_charm]. expert_kit (which
# has no genre utility slot) gains utility [world_lockpick].
class_tables:
  warrior_kit:
    utility: [world_lockpick]
    light: [world_torch]
  expert_kit:
    utility: [world_lockpick]
guaranteed_grants:
  warrior_kit:
    - {item: world_charm}
