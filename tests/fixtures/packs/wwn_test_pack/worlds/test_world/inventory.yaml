currency:
  name: mark
  denominations:
    - copper
    - silver
    - mark

item_catalog:
  - id: dagger_iron
    name: Iron Dagger
    description: A plain iron dagger of honest guild make.
    category: weapon
    value: 10
    weight: 0.5
    rarity: common
    power_level: 1
    tags: [melee, blade, one-handed]
    damage: {dice: "1d4", bonus: 0}
    lore: Carried by everyone who has ever had reason to need one carried.
    narrative_weight: 0.1

  - id: sword_iron
    name: Iron Longsword
    description: A sturdy iron longsword, guild-marked at the ricasso.
    category: weapon
    value: 30
    weight: 2.0
    rarity: common
    power_level: 2
    tags: [melee, blade, one-handed]
    damage: {dice: "1d8", bonus: 0, shock: 2, shock_ac: 15}
    lore: The standard blade of every house-guard in the current age.
    narrative_weight: 0.2

  - id: rapier_fine
    name: Fine Rapier
    description: A duelist's rapier with a chased guard and a personal maker's mark.
    category: weapon
    value: 120
    weight: 1.2
    rarity: uncommon
    power_level: 3
    tags: [melee, blade, one-handed, courtly]
    damage: {dice: "1d8", bonus: 0, shock: 1, shock_ac: 15}
    lore: Favoured by those who attend formal challenges in the courts of the declining houses.
    narrative_weight: 0.4

  - id: staff_pilgrim
    name: Pilgrim's Staff
    description: A weathered walking staff with a Path-Eater route-token knotted into the grip.
    category: weapon
    value: 8
    weight: 1.4
    rarity: common
    power_level: 1
    tags: [melee, blunt, two-handed, focus, pilgrim]
    damage: {dice: "1d6", bonus: 0, shock: 1, shock_ac: 13}
    lore: Cut from a specific kind of wood at a specific waystation, and consecrated in the traditional manner of the Path-Eater cult.
    narrative_weight: 0.3

  - id: leather_armor_worn
    name: Travel Leathers
    description: A well-kept set of leathers patched at the knees and elbows.
    category: armor
    value: 18
    weight: 5.0
    rarity: common
    power_level: 1
    tags: [light-armor, torso]
    lore: The working wardrobe of anyone who moves between settlements on their own feet.
    narrative_weight: 0.1
    armor_class: 13
    mitigation: 1

  - id: chain_shirt
    name: Chain Shirt
    description: A shirt of interlocking iron rings, noisy but effective.
    category: armor
    value: 60
    weight: 10.0
    rarity: uncommon
    power_level: 3
    tags: [medium-armor, torso]
    lore: Standard kit for the house-guards of the declining Perault lines.
    narrative_weight: 0.2
    armor_class: 15
    mitigation: 1

  - id: liturgical_surcoat
    name: Liturgical Surcoat
    description: A surcoat in the precise colors of a specific feeding cult, with the rite-sigils embroidered at the hem.
    category: armor
    value: 90
    weight: 2.5
    rarity: uncommon
    power_level: 2
    tags: [light-armor, torso, liturgical]
    lore: Worn by temple knights and senior oath-sworn. Each cult's colors are specific and recognized.
    narrative_weight: 0.4
    armor_class: 14
    mitigation: 1

  - id: healing_poultice
    name: Herbalist's Poultice
    description: A cloth bundle of dried herbs and ground reagent that speeds natural healing.
    category: consumable
    value: 10
    weight: 0.2
    rarity: common
    power_level: 1
    tags: [healing, herbal]
    lore: Prepared by the herbalists of any Kragmoor quarter. Quality varies by the district's reputation.
    narrative_weight: 0.1

  - id: residue_salts
    name: Reagent Salts
    description: A small pouch of the precise residue-salts used as reagents in common thaumaturgic workings.
    category: consumable
    value: 15
    weight: 0.3
    rarity: common
    power_level: 1
    tags: [reagent, guild]
    lore: Sold at the guild markets in measured doses. A workshop consumes several doses in a day.
    narrative_weight: 0.1

  - id: feeding_incense
    name: Cult Incense
    description: A bundle of thin sticks of incense blended for a specific cult's rite.
    category: consumable
    value: 12
    weight: 0.1
    rarity: common
    power_level: 1
    tags: [ritual, cult]
    lore: Available at the temple's offering-yard. The scent is distinct enough that the informed can tell which cult it serves.
    narrative_weight: 0.2

  - id: tally_book
    name: Scribe's Tally Book
    description: A small leather-bound ledger with pre-ruled columns for recording offerings, debits, and small workings.
    category: focus
    value: 25
    weight: 0.4
    rarity: common
    power_level: 1
    tags: [focus, clerical, scribe]
    lore: The working tool of scribes, clerks, and feed-keepers. Every entry is permanent.
    narrative_weight: 0.3

  - id: pact_token
    name: Pact Token
    description: A small worked metal or bone token bearing the sigil of a patron, worn where only the informed would see it.
    category: focus
    value: 50
    weight: 0.1
    rarity: uncommon
    power_level: 2
    tags: [focus, warlock, pact]
    lore: Given to warlocks at the formal signing of the agreement. It is how the patron is reached. It is also how the patron reaches back.
    narrative_weight: 0.5

  - id: house_signet
    name: House Signet
    description: A ring bearing the sigil of one of the Perault houses, whose authority depends on whether that house's line still holds.
    category: focus
    value: 80
    weight: 0.1
    rarity: uncommon
    power_level: 2
    tags: [focus, noble, sigil]
    lore: Inherited from an elder of the line. Signs documents, opens certain doors, and marks the wearer as someone with an inheritance to answer to.
    narrative_weight: 0.4

  - id: kin_charm
    name: Kin Charm
    description: A small bound charm of knotted cord, carved wood, and a single stone chosen from a specific place.
    category: focus
    value: 20
    weight: 0.1
    rarity: common
    power_level: 1
    tags: [focus, covenant, kin]
    lore: Carried by Orvinnic and some sympathetic others. The charm acknowledges a covenant's current terms and is visible to those who understand its making.
    narrative_weight: 0.3

  - id: guild_mark
    name: Guild-Mark Token
    description: A stamped token of a specific Kragmoor thaumaturgy guild, certifying the bearer's qualification.
    category: focus
    value: 35
    weight: 0.1
    rarity: common
    power_level: 1
    tags: [focus, guild, sorcerer]
    lore: Issued at the completion of apprenticeship. Required to practice thaumaturgy within the quarters of any properly guilded city.
    narrative_weight: 0.3

  - id: ledger_knife
    name: Scribe's Ledger Knife
    description: A small, very sharp knife used for lifting or altering entries in an old-style ledger — and, historically, for worse.
    category: weapon
    value: 25
    weight: 0.3
    rarity: uncommon
    power_level: 1
    tags: [blade, one-handed, scribe, forgery]
    damage: {dice: "1d4", bonus: 0}
    lore: Strictly speaking a scribal tool. Carried openly by ledger-thieves who are past pretending otherwise.
    narrative_weight: 0.3

# Starting kits keyed by class DISPLAY NAME (chargen_loadout does a
# case-insensitive display-name lookup; item ids must exist in item_catalog
# above or the seam fails loud). Covers all seven Callings in classes.yaml —
# the five doom Callings plus the two Barsoom Callings (Mentalist /
# Super-scientist), which draw from the same genre catalog: on Barsoom the
# long-sword is every fighting hand's weapon, whatever else they practise.
starting_equipment:
  Warrior:
    - sword_iron
    - dagger_iron
    - chain_shirt
    - healing_poultice
  Expert:
    - sword_iron
    - leather_armor_worn
    - tally_book
    - healing_poultice
  Necromancer:
    - staff_pilgrim
    - tally_book
    - residue_salts
    - healing_poultice
  Elementalist:
    - staff_pilgrim
    - guild_mark
    - residue_salts
    - healing_poultice
  Pact-born:
    - sword_iron
    - pact_token
    - feeding_incense
    - healing_poultice
  Mentalist:
    - sword_iron
    - dagger_iron
    - healing_poultice
  Super-scientist:
    - sword_iron
    - dagger_iron
    - residue_salts
    - healing_poultice

starting_gold:
  Warrior: 25
  Expert: 40
  Necromancer: 30
  Elementalist: 30
  Pact-born: 35
  Mentalist: 20
  Super-scientist: 40
