# Barsoom — World Items (story 89-4): super-science AS GEAR
#
# Per the design spec §6 ("Super-science as gear"): the everyday pulp toys of
# Barsoom — radium rifles and pistols, fliers on the buoyancy ray, mechanical
# telepathy — are ORDINARY INVENTORY so non-casters get the pulp marvels. They
# are NOT spells. The Super-scientist spell list (disintegration ray, vat-life,
# brain-swap) lives in the genre spells_wwn.yaml; this file is the device half
# of the same tradition, expressed as gear any character can carry or board.
#
# Loaded by the world loader (loader.py:_load_world_items → WorldItemsCatalog).
# Sections are tolerant (id + name required, extra fields read by the narrator).
# Item ids must be unique across the whole file.
#
# Telepathy as a UNIVERSAL baseline is NOT here and NOT a device: it is a
# narrator-framed default for every Barsoomian (see lore.yaml
# magic_narrator_baseline). The mechanical_telepath device below is the
# super-science ENHANCEMENT of that baseline (range, recording), not the
# baseline itself.

world: barsoom
genre: heavy_metal

# ── Special, characterful devices (item_legacy-shaped "named" items) ───────
named_items:
  - id: radium_rifle
    name: Radium Rifle
    category: weapon
    rarity: common
    power_level: 2
    tags: [ranged, firearm, radium, two-handed]
    description: >-
      The long-arm of every Barsoomian fighting man — a slender rifle of
      light alloy firing radium shells that are inert in shadow and detonate
      the instant sunlight touches the exploded powder. Wickedly accurate
      across the thin-aired dead sea bottoms, where a marksman can see for
      miles. Honor, though, still keeps it holstered for the long-sword.
    lore: >-
      Sighted by a mechanism that calculates the curvature of the planet;
      a green Martian's is sized for a fifteen-foot frame and a four-armed
      grip. Useless in a lightless cavern, which is why the under-worlds
      are still fought with steel.
    ammo: radium_shells
    narrative_weight: 0.3

  - id: radium_pistol
    name: Radium Pistol
    category: weapon
    rarity: common
    power_level: 1
    tags: [ranged, firearm, radium, sidearm, one-handed]
    description: >-
      The sidearm companion to the rifle — the same daylight-fired radium
      shell in a compact frame worn at the harness. Drawn rarely and by
      code reluctantly: to answer a personal quarrel with the pistol rather
      than the blade is, in most red cities, a confession of cowardice.
    lore: >-
      Inert in the dark, like all radium arms. A duelist who reaches for it
      first had better be sure no one of standing is watching.
    ammo: radium_shells
    narrative_weight: 0.3

  - id: one_man_flier
    name: One-Man Flier
    category: vehicle
    rarity: uncommon
    power_level: 3
    tags: [vehicle, flier, buoyancy-ray, scout]
    description: >-
      A slim scout-flier riding the eighth-ray buoyancy tanks that float it
      against the thin air — a sliver of metal and stretched fabric a single
      rider drives at speed above the dead sea bottoms. The repulsion-ray
      holds it up whether the engine runs or not; cut the engine and it
      drifts, it does not fall.
    lore: >-
      The buoyancy tanks are charged with the same ray that no living
      Barsoomian can make fresh — only refill from the dwindling old stock.
      A holed tank leaks lift, not gas; a badly holed flier sinks slowly
      enough to argue about.
    crew: 1
    narrative_weight: 0.6

  - id: war_flier
    name: War-Flier
    category: vehicle
    rarity: rare
    power_level: 5
    tags: [vehicle, flier, buoyancy-ray, warship, crewed]
    description: >-
      A fighting ship of a city's flier-navy — a long armored hull on great
      buoyancy tanks, bristling with radium guns and crewed by scores, the
      pride and the long arm of a jeddak. Helium's fleets and Zodanga's contest
      the thin sky in slow, terrible broadsides above the ochre desert.
    lore: >-
      No city alive can build the buoyancy apparatus from nothing; the great
      fliers are inherited, repaired, and fought over, never truly replaced.
      To lose a war-flier is to lose a piece of the world that will not come
      back.
    crew: many
    narrative_weight: 0.9

  - id: mechanical_telepath
    name: Mechanical Telepath
    category: device
    rarity: rare
    power_level: 3
    tags: [device, telepathy, super-science, communication]
    description: >-
      A brass-and-crystal apparatus of the master scientists that takes the
      universal Barsoomian mind-read and EXTENDS it — across miles, through a
      shield, or onto a recording crystal that can be played back. Where every
      Martian reads the surface thought of the man before him, this reads the
      man over the horizon.
    lore: >-
      Rare, jealously kept, and faintly dreaded — a mind-veil that stops a
      living telepath does not always stop the machine. The super-scientist
      who owns one knows more than he should, and everyone near him suspects
      it.
    enhances_baseline: telepathy
    narrative_weight: 0.5

  - id: atmosphere_gauge
    name: Atmosphere-Plant Key-Gauge
    category: device
    rarity: rare
    power_level: 2
    tags: [device, super-science, plot, atmosphere]
    description: >-
      A small sealed instrument carried by the keepers of the great
      Atmosphere Plant — a gauge and a coded key that together read, and in
      part command, the single machine on which every breathing thing on
      Barsoom depends. To hold one is to hold a thread of the world's life.
    lore: >-
      The deep secret of the Plant's working died with its builders; the
      key-gauges are inherited tokens of an authority no one can any longer
      fully exercise. Losing one is a planetary emergency, slowly arriving.
    narrative_weight: 0.7

# ── Single-use super-science (consumable lane) ─────────────────────────────
consumable_items:
  - id: radium_shells
    name: Radium Shells
    category: consumable
    rarity: common
    power_level: 1
    tags: [ammunition, radium, daylight]
    description: >-
      A clip of the glass-tipped shells that feed radium rifles and pistols:
      a wad of opaque powder behind an explosive of daylight, harmless in the
      dark and savage in the sun. Standard issue across every fighting force
      of the red and green worlds.
    lore: >-
      Manufacture survives where the deeper sciences have not; a canal-city
      armory still turns these out by the thousand. They are why a flier
      never fights a night action by choice.
    narrative_weight: 0.1

  - id: invisibility_compound_flask
    name: Flask of Invisibility Compound
    category: consumable
    rarity: rare
    power_level: 3
    tags: [super-science, stealth, compound, single-use]
    description: >-
      A stoppered flask of Phor Tak's blue compound — the gear form of the
      super-scientist's working, for those without the training. Brushed over
      skin or hull it bends the light away until the wearer is a shimmer and
      then nothing, for as long as the coat holds.
    lore: >-
      The recipe is one mad inventor's jealously guarded secret; a stolen
      flask is worth a war. The coat wears thin with sweat and time, and a
      man counting on it learns to count the minutes.
    grants_effect: invisibility
    narrative_weight: 0.4

  - id: healing_serum
    name: Barsoomian Healing Serum
    category: consumable
    rarity: uncommon
    power_level: 2
    tags: [super-science, healing, serum, single-use]
    description: >-
      A vial of the surgeons' serum that closes a sword-wound in hours that
      should take weeks — a small everyday miracle of a science that can lift
      a brain whole from one skull to another. The red cities heal fast; it
      is one reason a thousand-year life is survivable in so violent a world.
    lore: >-
      The common product of an uncommon art. The same laboratories that
      brew it keep darker work behind locked doors, and a wise patient does
      not ask what else was on the table.
    grants_effect: healing
    narrative_weight: 0.2
