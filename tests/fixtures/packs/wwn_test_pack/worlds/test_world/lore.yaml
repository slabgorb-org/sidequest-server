world_name: Barsoom

geography: >-
  The oceans of Barsoom drained an age ago. What remains is a desert
  of cracked ochre sea-bottoms furred with pale moss, falling away
  into the deep umber basins where the seas once stood, and dotted
  with the thousands of marble dead cities the water left stranded.
  The living red cities cluster along ruled canals that carry water
  from the two polar ice-caps across the dead world; outside the
  narrow cultivated canal-belt the desert begins at once. Two small
  moons cross the sky each night, swift and close. The whole planet
  breathes only because one great Atmosphere Plant still turns, far
  out on the desert — a single windowless pile of metal and masonry
  that no one alive can match or rebuild. It is the overdue ledger
  of the world: when it fails, everything that breathes will stop.

cosmology: >-
  There is little true sorcery on Barsoom; its marvels are old
  science and the trained mind. Every Martian reads the surface
  thought of another unless they have learned to shield, and a
  practised telepath can hide their own surface while reading yours —
  so deceit is a craft and privacy is a discipline. Fliers ride a
  repulsion-ray that buoys them against the thin air; radium pistols
  fire shells that explode in sunlight and lie inert in the dark.
  Older and stranger powers are rumored at the poles and in hidden
  places, but in the red world a quarrel is still settled by the
  long-sword, and honor outranks every machine.

factions:
  - name: Helium
    summary: "The first city of the red world — fliers, honor, and the long-sword."
    description: >-
      The twin scarlet tower-cities of Greater and Lesser Helium, the
      most civilized power of the red world: jealous of its honor,
      generous to a guest who keeps the code, lethal to one who breaks
      it. Helium means to hold its canal-belt, out-fly its rival
      Zodanga, and keep the guest-code inviolate. The PCs' likely home
      or host.
    disposition: honorable-proud
  - name: Zodanga
    summary: "Helium's jealous rival — the city of the unspoken assassins' guild."
    description: >-
      A red tower-city that settles a quarrel with a hired blade in the
      dark and denies, always, that its assassins' guild exists.
      Zodanga works to undercut Helium, expand the canal tribute in its
      own favor, and place its quiet agents where Helium cannot see
      them.
    disposition: smiling-treacherous
  - name: The Green Hordes
    summary: "Thark and Warhoon — four-armed giants of the dead sea bottoms."
    description: >-
      Fifteen-foot, four-armed, tusked nomads who own no cities and
      camp in the marble ruins between their endless wars — Thark
      against Warhoon, green against every red city. Rank is taken by
      killing the holder; they raid the canal-belt and hold the dead
      bottoms by the war-mount and the radium rifle.
    disposition: cruel-martial
  - name: The Holy Therns
    summary: "The white false-priests of the Valley Dor — keepers of the death-pilgrimage fraud."
    description: >-
      A white-skinned priesthood of the far south, hairless beneath
      flowing yellow wigs, who pass themselves off as a holy race exempt
      from death and harvest the pilgrims that voyage down the River Iss
      to the false heaven of the Valley Dor. Ruled by the Hekkador, the
      Father of Therns, from the temples of the Golden Cliffs, they mean
      to keep their ten-thousand-year secret at any cost and would sooner
      see a world suffocate than let the truth of Dor climb back up the
      river. They war in shadow with the First Born who raid them, and
      with any pilgrim who learns too much.
    disposition: holy-fraudulent
  - name: The First Born of Omean
    summary: "Black corsairs of the buried sea — worshippers of Issus, raiders of the Thern temples."
    description: >-
      The black men of Omean, the buried sea beneath the south pole, who
      hold themselves the oldest and highest race of Barsoom and answer
      to none but the goddess Issus. From their sunless caverns they rise
      by night in black fliers to raid the surface and the Thern temples
      above them — preying on the priests who prey on the pilgrims. Cold,
      beautiful, and undefeated in the open, they take slaves and not
      friends, command Omean's fleets through their dators, and feed
      their goddess as living men are made to feed a god.
    disposition: predatory-divine
  - name: The Okar Yellow Throne
    summary: "Salensus Oll's domed northern kingdom — the bearded yellow men behind the ice."
    description: >-
      The kingdom of the bearded yellow men, who keep crystal-domed
      hothouse cities of warmth and green against the polar ice behind the
      deadly Carrion Caves. Ruled from Kadabra by Salensus Oll, who styles
      himself jeddak of jeddaks, the Okar throne wants no commerce with the
      world below, takes prisoners rather than guests for its arenas, and
      guards its one ice-gate jealously — even as the tyrant dreams of
      carrying his power down from the pole to conquer the warm world he
      pretends to despise.
    disposition: suspicious-tyrannical
  - name: Marentina
    summary: "The free northern dome — the yellow-Martian principality that defies the jeddak of jeddaks."
    description: >-
      The dissident crystal-domed city of the yellow men, apart from
      Kadabra and unwilling to bend to Salensus Oll. Marentina keeps an
      older, freer court and gives quiet shelter to those the tyrant's
      arenas would swallow — too useful to the north's defense to be
      destroyed, too independent to be trusted, and the one ally an
      outsider might find north of the ice.
    disposition: free-honorable
  - name: Lothar
    summary: "The isolationist phantom-conjurers — the last of an older Mars, far to the west."
    description: >-
      The last handful of an ancient white seafaring race, surviving in the
      ruined city of Lothar on the shore of the dead sea of Throxeus by the
      power of the mind alone. Besieged for ages by the green hordes, they
      hold their crumbling walls by conjuring phantom bowmen out of pure
      thought — armies real enough to kill for as long as they are believed
      in. Half-mad with age and isolation, they feud among themselves over
      whether their phantoms are mere illusion or something that can be made
      truly real, and they trust no outsider who cannot tell a true thing
      from a thing merely willed to seem so.
    disposition: isolationist-uncanny

rumored:
  - "Pilgrims who grow old voyage down the River Iss to a southern paradise from which none return. Every red Martian believes it; not one has come back to confirm it. (The Valley Dor is real, and it is not what the faith promises.)"
  - "Bearded yellow men are said to live behind the ice at the north pole, in cities under glass. (A northern matter.)"
  - "An ancient white people in a hidden city are said to conjure armies out of nothing but their minds. (Lothar — a matter for those who reach it.)"

# ── Magic narrator baseline (story 89-4) ──────────────────────────────────
# A narrator-read anchor for how magic FEELS on Barsoom. This is FLAVOR, not
# mechanics: the Effort / System-Strain engine and the two caster spell lists
# live in the genre tier (rules.yaml, spells_wwn.yaml). This block tells the
# narrator the texture so prose stays canon-true.
magic_narrator_baseline:
  telepathy_baseline: >-
    Telepathy is the UNIVERSAL Barsoomian default — not a spell, not a class
    feature, but the air everyone breathes. Every Martian (red, green, black,
    white, yellow, Lotharian — and a transported Earthman soon learns it)
    reads the SURFACE thought of whomever they face, unless that mind has been
    deliberately shielded. So on Barsoom: spoken lies are nearly useless at
    close range; deceit is the CRAFT of shielding your surface while reading
    another's; privacy is a learned discipline, not a default; and a stranger
    who cannot be read at all is immediately suspect. The narrator should let
    this colour ordinary scenes — an honest Barsoomian half-hears intentions;
    a skilled one shows a calm blank and listens. It does NOT read deep memory
    or secrets held below the surface, and it does not cross great distance
    (that needs the mechanical_telepath device, items.yaml).
  caster_traditions:
    - id: lotharian_mentalist
      label: "The Lotharian Mentalist"
      register: >-
        The phantom-conjurers of Lothar. Their magic is the universal mind-
        craft pushed to its terrifying end: the will exhausting the body to
        force an image into shared reality — bowmen real enough to kill, whole
        false legions, conjured terrors and places. The canon hook is "real
        until disbelieved": a Lotharian working is solid to anyone who does
        not KNOW it is unreal, and the deepest masters are rumored to sustain
        their own ancient bodies by will alone. Cost lands as bodily
        exhaustion (Effort / System Strain), never as blood-debt. Spell list:
        genre spells_wwn.yaml (phantom_bowmen, mind_veil, realized_terror,
        false_legion, thought_lance, phantom_reality, domination, ...).
    - id: barsoomian_super_scientist
      label: "The Barsoomian Super-scientist"
      register: >-
        The vanished-science tradition of Ras Thavas and Phor Tak. Not
        sorcery — apparatus, ray, and a cold exhausting concentration, dressed
        in the same Effort / System-Strain economy. Disintegration rays,
        invisibility compound, paralysis fields, mechanical brains, and the
        moral horrors: vat-grown synthetic life and the brain-transfer
        operation. Narrate the COST and the unease as concretely as the
        marvel. The everyday toys of this science (radium rifles, fliers,
        mechanical telepathy) are GEAR (items.yaml), so a non-caster red
        Martian still gets the pulp hardware; only the rare super-scientist
        works the spell-level marvels.
  super_science_as_gear: >-
    Barsoom is canonically LOW-magic with HIGH science. Most "magic" a player
    meets is a device, not a working: the radium rifle, the buoyancy-ray
    flier, the healing serum, the mechanical telepath. These are in
    items.yaml and any character may carry or board them. Reserve the
    spells_wwn marvels for the two rare caster traditions; let the gear carry
    the rest of the wonder.
  honor_outranks_the_machine: >-
    Across all of it, the long-sword is prized by code over the ray. A
    Barsoomian of standing answers a personal quarrel with steel; reaching
    first for a radium pistol in a duel is a confession of cowardice. Keep
    the marvels present but let honor, not firepower, decide the scenes that
    matter.
