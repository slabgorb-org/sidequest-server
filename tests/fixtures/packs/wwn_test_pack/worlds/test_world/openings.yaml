version: "0.1.0"
world: barsoom
genre: heavy_metal

openings:
  - id: earthman_dead_sea_arrival
    name: "The Dead Sea Bottom — A Stranger Wakes"
    triggers:
      mode: solo
      backgrounds: []
    setting:
      location_label: "The cracked sea-bottom near the dead city of Korad"
    tone:
      register: vast, disorienting, wondrous-then-dangerous
      avoid_at_all_costs:
        - explaining the planet to the player as exposition
        - a friendly guide arriving to narrate the rules
        - softening the immediate danger of the green camp nearby
    establishing_narration: >-
      You wake on cracked ochre ground under a sky the wrong color,
      the air thin and cold in your chest, your own body suddenly
      strange — light, springy, as if the ground wants to throw you
      at the sky. A few hundred yards off, among toppled marble
      columns, something enormous moves: a camp of fifteen-foot
      figures and eight-legged mounts. You are naked, unarmed, and
      newly, impossibly strong. They have not seen you yet.
    first_turn_invitation: >-
      The moss under your hands is real, the cold is real, and the
      giants in the ruins are real. Your first careless step nearly
      launches you off your feet — whatever world this is, it holds
      you lighter than the one you left. The nearest column is twenty
      yards. The camp is a hundred. Nothing here is waiting for you to
      be ready.

  - id: helium_landing_stage
    name: "Greater Helium — The Landing-Stage"
    triggers:
      mode: either
      backgrounds: []
    setting:
      location_label: "The high mooring-stage of Greater Helium"
    tone:
      register: proud, formal, honor-bound
      avoid_at_all_costs:
        - tavern-style quest boards
        - NPCs who trust strangers instantly
        - treating Helium as a generic fantasy city
    establishing_narration: >-
      A flier has set you down on the high stage beneath the great
      scarlet tower of Greater Helium, where the dwar Kantos Vah is
      taking the measure of new arrivals — not rudely, but completely,
      the way an honorable man weighs a stranger he may have to trust
      with a blade at his back. The canal shines far below. A Zodangan
      with very correct papers is also on the stage, and is also being
      weighed, and is enjoying it more than he should.
    first_turn_invitation: >-
      The wind off the desert is thin and hard at this height. Kantos
      Vah stands with one hand resting on the hilt of a long-sword he
      has clearly used, his copper face unreadable, waiting to hear
      how you account for yourself. The smiling man a few steps away
      lets you go first.

  - id: helium_table_convened
    name: "Greater Helium — A Common Cause"
    triggers:
      mode: multiplayer
      backgrounds: []
      min_players: 2
      max_players: 6
    setting:
      location_label: "A high chamber of the scarlet tower, Greater Helium"
    tone:
      register: formal, urgent, honor-bound
      avoid_at_all_costs:
        - a single NPC monologuing the mission
        - forcing the party to already know each other
        - softening the stakes of the canal-tribute crisis
    establishing_narration: >-
      You have each been summoned to a high chamber of the scarlet
      tower for reasons that are about to become one reason. The
      canal-tribute talks with Zodanga have gone wrong; a flier is
      overdue; and the dwar Kantos Vah has decided he would rather
      trust an untried band that owes the city nothing than the court
      factions that owe it everything. He has not told you yet that
      you are now, collectively, his unprovable suspicion made flesh.
    first_turn_invitation: >-
      The chamber is tall and scarlet and very quiet. Kantos Vah looks
      from one of you to the next, taking your measure as a group the
      way he would a hand of cards he did not deal. Then he says that
      what he is about to say does not leave this room, and waits to
      see which of you answers first.

  # ---------------------------------------------------------------------------
  # The South (Story 89-2) — per-origin openings for characters originating in
  # or arriving at the death-pilgrimage country. Solo + MP coverage.
  # ---------------------------------------------------------------------------
  - id: valley_dor_pilgrim_lands
    name: "The Valley Dor — Paradise Is a Lie"
    triggers:
      mode: solo
      backgrounds: []
    setting:
      location_label: "The shore of the Lost Sea of Korus, in the Valley Dor"
    tone:
      register: beautiful-then-horrifying, solemn, dawning-dread
      avoid_at_all_costs:
        - explaining the Thern fraud to the player as exposition
        - a kindly priest welcoming the pilgrim to a real heaven
        - softening the immediate danger of the valley's hunters
    establishing_narration: >-
      The River Iss has carried you all the long grey way to its mouth,
      and the faith was not wrong about the beauty: you step ashore into
      a warm valley of crimson sward and golden moss around a still dark
      sea, walled by cliffs of burning gold. It was wrong about
      everything else. The garlanded pilgrims who landed before you are
      not being welcomed. Among the flowering trees something tall and
      hairless and white is moving toward them on too many limbs, and it
      is not slow, and no one in a yellow wig on the high terraces is
      lifting a hand to stop it.
    first_turn_invitation: >-
      The heaven you were promised is real ground under real feet, and it
      is hunting the people you came down the river with. The white thing
      among the trees has not turned toward you yet. The cliffs are a mile
      of sheer gold with priests watching from the balconies. Whatever you
      do next, the one thing the Valley Dor does not allow is for you to
      simply leave knowing what you now know.

  - id: thern_apostate_cliffs
    name: "The Golden Cliffs — A Priest Stops Believing"
    triggers:
      mode: solo
      backgrounds: []
    setting:
      location_label: "A cliff-side temple gallery in the Golden Cliffs of the Otz Mountains"
    tone:
      register: cold, complicit, quietly damning
      avoid_at_all_costs:
        - having the apostate already be a clean-handed hero
        - an outsider arriving to explain the fraud the apostate already runs
        - treating the Thern faith as obviously, cartoonishly evil from the inside
    establishing_narration: >-
      You have worn the yellow wig and kept the secret your whole long
      false-eternal life, and from this gallery you have watched ten
      thousand pilgrims walk smiling into the harvest below and called it
      holy. Today there is a girl among them who looked up at the cliffs
      the way you used to look up at the goddess — with absolute trust —
      and something in you that you thought the temple had killed a
      century ago has just, inconveniently, refused to die. The Hekkador
      Sator Throg is three terraces above you. The harvest is beginning.
    first_turn_invitation: >-
      Every belief you have is a tool the temple put in your hands, and
      one of them has just turned in your grip. Below, the priests move to
      their work; above, the Father of Therns presides; and you are
      standing very still on a gallery of gold, a man who has kept the
      faith perfectly until exactly this moment, deciding what the next
      one is worth.

  - id: omean_slaves_rise
    name: "Omean — The Buried Sea, A Common Chain"
    triggers:
      mode: multiplayer
      backgrounds: []
      min_players: 2
      max_players: 6
    setting:
      location_label: "A slave-barge on the black sea of Omean, beneath the south pole"
    tone:
      register: oppressive, conspiratorial, defiant
      avoid_at_all_costs:
        - a single NPC monologuing the plan to escape
        - the First Born appearing beatable or careless
        - forcing the captives to already trust one another
    establishing_narration: >-
      You were taken — down the river, or off a raided deck, or up out of
      a Thern garden — and you have all ended in the same dark: chained on
      a barge crossing the sunless sea of Omean under a sullen red sun
      buried in the rock, bound for the temple of a goddess who eats what
      is brought to her. The black dator at the rail thinks you are
      cargo. He is not wholly wrong. But the First Born have never been
      beaten in the open because no one beaten in the open has ever lived
      to be in a position like this one: together, unwatched for a
      moment, and out of anything left to lose.
    first_turn_invitation: >-
      The chain runs from wrist to wrist down the line of you; the red
      radium glow throws every face into the same grim light; the dator's
      back is turned, briefly, as the barge swings toward the temple isle.
      None of you chose the others. All of you are about to find out what
      the people on either end of your chain are made of, and you have
      until the barge touches the quay to decide.

  # ---------------------------------------------------------------------------
  # The North & Lothar (Story 89-3) — per-origin openings for the frozen north
  # and the dreaming western ruin. Solo + MP coverage, location-anchored
  # (location_label only, no region_id), matching the 89-2 openings.
  # ---------------------------------------------------------------------------
  - id: okar_arena_prisoner
    name: "Kadabra — The Arena of the Jeddak of Jeddaks"
    triggers:
      mode: solo
      backgrounds: []
    setting:
      location_label: "The arena pit beneath the crystal dome of Kadabra, in Okar"
    tone:
      register: cold, defiant, wondrous-then-deadly
      avoid_at_all_costs:
        - explaining Okar to the player as exposition
        - a guard who conveniently turns sympathetic to narrate the escape
        - softening the lethality of the tyrant's games
    establishing_narration: >-
      You crossed the ice and the Carrion Caves and lived, which only
      bought you this: dragged out onto the sand of an arena beneath a vast
      crystal dome, warm green light overhead, the cold blue waste pressing
      against the glass beyond. On a high throne sits a black-bearded man in
      furred harness — Salensus Oll, who calls himself jeddak of jeddaks —
      and all around him the yellow men of the north have come to watch a
      stranger from the world below die for their sport. A gate across the
      sand is grinding open onto something that snarls.
    first_turn_invitation: >-
      The sand is warm under your feet and the air smells of green growing
      things and old blood. The tyrant on the throne has not even leaned
      forward; to him you are already a settled matter. Whatever is coming
      through the far gate is not. You have a moment before it clears the
      dark of the tunnel, and nothing in this dome is on your side.

  - id: lothar_phantom_walls
    name: "Lothar — The Bowmen Who Are Not There"
    triggers:
      mode: solo
      backgrounds: []
    setting:
      location_label: "A broken rampart of the ruined city of Lothar, above the dead sea of Throxeus"
    tone:
      register: eerie, dreamlike, quietly threatening
      avoid_at_all_costs:
        - explaining the phantom-bowman mystery to the player as exposition
        - a Lotharian who simply tells you which men are real
        - treating the conjured army as obviously fake from the first glance
    establishing_narration: >-
      You came west across the dead bottoms half-dead with thirst and found
      a city where there should be only ruin — white marble towers above a
      drained ocean, and on the crumbling walls a thousand archers loosing
      arrow after arrow at the green horde swarming the plain below. It was
      a long moment before you understood what was wrong: the arrows kill,
      the green men fall screaming — and the archers cast no shadow, and at
      the edges they are coming a little apart, like smoke that has decided
      to look like men. One of them has just turned its pale face to look at
      you.
    first_turn_invitation: >-
      The battle on the walls is real enough to die in and made of something
      you cannot name. Below, the horde is real; the men holding the city
      may not be; and somewhere among the towers the will that dreams all
      these bowmen is deciding what to make of a stranger who can see the
      seam. Whatever you do next in Lothar, the first thing it will test is
      whether you can tell a true thing from a thing merely willed to seem
      true.

  - id: marentina_table_convened
    name: "Marentina — A Conspiracy Under Glass"
    triggers:
      mode: multiplayer
      backgrounds: []
      min_players: 2
      max_players: 6
    setting:
      location_label: "A warm-lit hall under the crystal dome of Marentina, in the far north"
    tone:
      register: conspiratorial, urgent, honor-bound
      avoid_at_all_costs:
        - a single NPC monologuing the plot against Salensus Oll
        - the prince trusting the party instantly because they reached the north
        - softening the danger of being seen as Marentina's friends
    establishing_narration: >-
      You have each reached the free dome of Marentina by a different hard
      road — over the ice, out of Kadabra's pits, off a wrecked flier — and
      Prince Talu has gathered you into a warm hall under the crystal while a
      deep indigo polar night and two swift moons stand beyond the glass. He
      has decided, against the counsel of every careful man he keeps, that an
      untried band of outsiders the jeddak of jeddaks does not yet know about
      is worth more to a free dome than another season of bending its neck.
      He has not told you yet that being in this room has already marked you.
    first_turn_invitation: >-
      The hall is warm and the night beyond the dome is very cold and very
      blue. Talu looks from one of you to the next, weighing strangers he
      cannot afford and cannot do without, then says that what he is about to
      ask does not leave this glass — and waits to see which of you is the
      first to answer a prince who has just made you all his enemies' enemy.
