# Distinct single-root system so per-region resolution can be proven to pick
# the right file (region 'vorn' -> systems/vorn.yaml, NOT yula's). The 'vorn'
# body id does NOT appear in yula.yaml and vice-versa, so a test can assert
# the loader returned the correct file by body membership alone.
# Synthetic TEST content — not shipped.
version: "0.1.0"
