  epoch_days: 0
travel:
  realism: orbital
bodies:
  vorn:
    type: star
    label: VORN
  vorn_depot:
    type: habitat
    parent: vorn
    semi_major_au: 0.6
    period_days: 50
    epoch_phase_deg: 90
    label: "VORN DEPOT"
